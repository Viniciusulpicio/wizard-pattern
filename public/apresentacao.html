<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Mail Setup Wizard • Apresentação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Poppins', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 16:9 Presentation Stage */
    .deck-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease-in-out;
      pointer-events: none;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
      display: block;
    }

    /* Subtle Toast Hint on First Load */
    .hint-toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #94A3B8;
      font-size: 0.8rem;
      padding: 8px 16px;
      border-radius: 20px;
      pointer-events: none;
      transition: opacity 0.6s ease;
      z-index: 100;
    }

    .hint-toast.hide {
      opacity: 0;
    }

    /* Speaker Notes Modal (Triggered ONLY by 'N' key) */
    .speaker-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(12px);
      border-top: 2px solid #3468A2;
      color: #F8FAFC;
      padding: 24px 36px;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 200;
      max-height: 40vh;
      overflow-y: auto;
    }

    .speaker-drawer.open {
      transform: translateY(0);
    }

    .speaker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .speaker-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9AB4D1;
    }

    .speaker-close {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .speaker-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #E2E8F0;
    }

    /* Print styles */
    @media print {
      body, .deck-container {
        height: auto;
        overflow: visible;
        background: #FFFFFF;
      }
      .slide {
        position: relative !important;
        opacity: 1 !important;
        visibility: visible !important;
        page-break-after: always;
        height: 100vh;
      }
      .hint-toast, .speaker-drawer {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Fullscreen Deck Stage (NO NAVBAR) -->
  <main class="deck-container" id="deck">
    <div class="slide active" data-slide="1">
      <img src="assets/slides/slide-1.png" alt="Slide 1 - Capa" />
    </div>

    <div class="slide" data-slide="2">
      <img src="assets/slides/slide-2.png" alt="Slide 2 - O Problema" />
    </div>

    <div class="slide" data-slide="3">
      <img src="assets/slides/slide-3.png" alt="Slide 3 - O Funil de Diagnóstico" />
    </div>

    <div class="slide" data-slide="4">
      <img src="assets/slides/slide-4.png" alt="Slide 4 - Impacto Financeiro" />
    </div>

    <div class="slide" data-slide="5">
      <img src="assets/slides/slide-5.png" alt="Slide 5 - Modelos de Arquitetura" />
    </div>

    <div class="slide" data-slide="6">
      <img src="assets/slides/slide-6.png" alt="Slide 6 - Regras de Cálculo & Automação" />
    </div>
  </main>

  <!-- Brief Hint (fades out in 3.5s) -->
  <div class="hint-toast" id="hint">Navegação: Setas ← → ou clique na tela • Tela cheia: F • Roteiro: N</div>

  <!-- Speaker Notes Drawer (Press N) -->
  <aside class="speaker-drawer" id="drawer">
    <div class="speaker-header">
      <span class="speaker-title">Roteiro de Fala • Slide <span id="drawerNum">1</span> / 6</span>
      <button class="speaker-close" id="drawerClose">&times;</button>
    </div>
    <p class="speaker-text" id="drawerText"></p>
  </aside>

  <script>
    const notes = {
      1: "Enterprise Mail Setup Wizard: desenvolvido por Victor Hugo, Pedro Lucas, Henzo Katsumuto, Luiz Seisdedo, Danilo Dezani, Vinicius Sulpicio e Bruno Viera para qualificar e gerar automaticamente o dimensionamento de infraestrutura de e-mail corporativo.",
      2: "O Problema: cotar e-mail corporativo tradicionalmente consome até 3 semanas de reuniões, gera superdimensionamento em dólar e propostas sem cálculo técnico real de segurança.",
      3: "O Funil de Diagnóstico: curadoria simplificada em 8 passos diretos e interativos. O cliente responde volume, tipo de hospedagem e requisitos de segurança em menos de 2 minutos, sem jargões complexos de Linux.",
      4: "Impacto Financeiro: combinando caixas executivas no Microsoft 365 com nuvem corporativa AlmaLinux para a operação, reduzimos a fatura anual de R$ 144 mil para R$ 43.200 — uma economia comprovada de 70% sem perder recursos corporativos.",
      5: "Modelos de Arquitetura: o motor classifica e gera automaticamente 5 arquiteturas padronizadas: da Nuvem Híbrida à Cloud Privada soberana com backup imutável WORM de até 5 anos contra ransomware.",
      6: "Regras de Cálculo & Automação: motor determinístico que calcula Security Score (0 a 100), storage total com margem de segurança de 20% e exporta o payload JSON pronto para provisionamento via Ansible e Terraform. Vamos direto para a demonstração prática no protótipo ao vivo!"
    };

    let cur = 1;
    const total = 6;

    // Define correct prototype target URL
    const PROTOTYPE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? '/'
      : 'https://viniciusulpicio.github.io/wizard-pattern/';

    function redirectToPrototype() {
      window.location.href = PROTOTYPE_URL;
    }

    const slides = document.querySelectorAll('.slide');
    const drawer = document.getElementById('drawer');
    const drawerNum = document.getElementById('drawerNum');
    const drawerText = document.getElementById('drawerText');
    const hint = document.getElementById('hint');
    const deck = document.getElementById('deck');

    // Auto-hide hint after 3.5 seconds
    setTimeout(() => {
      if (hint) hint.classList.add('hide');
    }, 3500);

    function goTo(idx) {
      if (idx < 1) idx = 1;
      if (idx > total) idx = total;
      cur = idx;

      slides.forEach(s => s.classList.remove('active'));
      const active = document.querySelector(`.slide[data-slide="${cur}"]`);
      if (active) active.classList.add('active');

      drawerNum.textContent = cur;
      drawerText.textContent = notes[cur] || "";
    }

    // Click navigation: Right 70% goes forward, Left 30% goes back
    deck.addEventListener('click', (e) => {
      // Don't intercept clicks on the drawer
      if (e.target.closest('.speaker-drawer')) return;

      const clickX = e.clientX;
      const width = window.innerWidth;
      if (clickX > width * 0.35) {
        if (cur === total) {
          // On last slide, clicking advances to live prototype
          redirectToPrototype();
        } else {
          goTo(cur + 1);
        }
      } else {
        goTo(cur - 1);
      }
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter' || e.key === 'PageDown' || e.key === 'ArrowDown') {
        if (cur === total) {
          redirectToPrototype();
        } else {
          goTo(cur + 1);
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp' || e.key === 'ArrowUp') {
        goTo(cur - 1);
      } else if (e.key === 'Home') {
        goTo(1);
      } else if (e.key === 'End') {
        goTo(total);
      } else if (e.key.toLowerCase() === 'n') {
        drawer.classList.toggle('open');
      } else if (e.key === 'Escape') {
        drawer.classList.remove('open');
      } else if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    document.getElementById('drawerClose').onclick = () => drawer.classList.remove('open');

    // Touch swipe support for mobile/tablets
    let touchStartX = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchEndX - touchStartX;
      if (Math.abs(diff) > 50) {
        if (diff < 0) {
          if (cur === total) redirectToPrototype();
          else goTo(cur + 1);
        } else {
          goTo(cur - 1);
        }
      }
    }, { passive: true });

    goTo(1);
  </script>
</body>
</html>
