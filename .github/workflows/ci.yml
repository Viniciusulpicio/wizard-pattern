name: CI - Wizard Pattern Engine

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  tests:
    name: PHP ${{ matrix.php-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        php-version: [ "8.1", "8.2", "8.3" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, json, curl, openssl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer Dependencies
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Lint PHP Syntax
        run: |
          echo "Verificando sintaxe de todos os arquivos PHP..."
          find src public templates tests -name "*.php" -exec php -l {} \;

      - name: Run Test Suite (Diagnostic Engine & Payload Validation)
        run: composer test

      - name: Smoke Test API Health Endpoint
        run: |
          php -S 127.0.0.1:8000 -t public > /dev/null 2>&1 &
          SERVER_PID=$!
          sleep 2
          curl --fail -s http://127.0.0.1:8000/api/health || exit 1
          kill $SERVER_PID
